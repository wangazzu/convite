<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedido para Sair</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            padding: 60px 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 500px;
            width: 90%;
            position: relative;
            z-index: 10;
        }

        h1 {
            color: #333;
            font-size: 2rem;
            margin-bottom: 40px;
            line-height: 1.4;
        }

        .buttons {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            padding: 15px 40px;
            font-size: 1.2rem;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 600;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        #yesBtn {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(17, 153, 142, 0.4);
        }

        #yesBtn:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(17, 153, 142, 0.6);
        }

        #noBtn {
            background: linear-gradient(135deg, #eb3349 0%, #f45c43 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(235, 51, 73, 0.4);
            position: relative;
            transition: transform 0.1s ease-out;
        }

        #noBtn:hover {
            box-shadow: 0 6px 20px rgba(235, 51, 73, 0.6);
        }

        .message {
            margin-top: 40px;
            font-size: 1.1rem;
            color: #666;
            min-height: 30px;
        }

        .success {
            color: #11998e;
            font-weight: 600;
            font-size: 1.3rem;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .hearts {
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
            z-index: 2;
        }

        .heart {
            position: absolute;
            font-size: 35px;
            animation: fallHeart linear forwards;
        }

        @keyframes fallHeart {
            0% {
                opacity: 0.9;
                transform: translateY(-60px);
            }
            50% {
                opacity: 1;
            }
            100% {
                opacity: 0;
                transform: translateY(110vh);
            }
        }

        .firework-heart {
            position: absolute;
            font-size: 30px;
            animation: explode 3.5s ease-out forwards;
            transform: translate(0, 0) scale(0);
            opacity: 0;
        }

        @keyframes explode {
            0% {
                opacity: 0;
                transform: translate(0, var(--launchHeight)) scale(0.3);
            }
            30% {
                opacity: 1;
                transform: translate(0, 0) scale(0.8);
            }
            45% {
                opacity: 1;
                transform: translate(0, 0) scale(1.2);
            }
            75% {
                opacity: 1;
                transform: translate(calc(var(--tx) * 0.7), calc(var(--ty) * 0.7)) scale(1);
            }
            100% {
                opacity: 0;
                transform: translate(var(--tx), var(--ty)) scale(0.5);
            }
        }

        .chicks {
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
            z-index: 1;
        }

        .kittens {
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
            z-index: 1;
        }

        .chick {
            position: absolute;
            font-size: 40px;
            animation: fallAnimal linear forwards;
            --swayX: 30px;
            --rotationEnd: 360deg;
        }

        .kitten {
            position: absolute;
            font-size: 40px;
            animation: fallAnimal linear forwards;
            --swayX: 40px;
            --rotationEnd: -360deg;
        }

        @keyframes fallAnimal {
            0% {
                opacity: 0.9;
                transform: translateY(-60px) translateX(0) rotate(0deg);
            }
            25% {
                transform: translateY(27.5vh) translateX(var(--swayX)) rotate(calc(var(--rotationEnd) * 0.25));
            }
            50% {
                opacity: 1;
                transform: translateY(55vh) translateX(calc(var(--swayX) * -0.5)) rotate(calc(var(--rotationEnd) * 0.5));
            }
            75% {
                transform: translateY(82.5vh) translateX(var(--swayX)) rotate(calc(var(--rotationEnd) * 0.75));
            }
            100% {
                opacity: 0;
                transform: translateY(110vh) translateX(calc(var(--swayX) * -1)) rotate(var(--rotationEnd));
            }
        }

        .chicken-snatch {
            position: fixed;
            font-size: 80px;
            z-index: 9999;
            pointer-events: none;
            top: 0;
            left: 0;
        }

        .chicken-snatch.flying {
            animation: chickenFlyIn 1.2s ease-in forwards;
        }

        .chicken-snatch.leaving {
            animation: chickenFlyOut 1.5s ease-out forwards;
        }

        .no-btn-snatched {
            animation: noBtnShake 0.3s ease-in-out 4, noBtnBeingTaken 1.5s ease-out 1.2s forwards;
            z-index: 9998 !important;
        }

        @keyframes chickenFlyIn {
            0% {
                transform: translate(-150px, -150px) rotate(-20deg) scale(0.5);
                opacity: 0;
            }
            20% {
                opacity: 1;
            }
            60% {
                transform: translate(var(--targetX), calc(var(--targetY) - 40px)) rotate(10deg) scale(1.1);
            }
            80% {
                transform: translate(calc(var(--targetX) + 10px), calc(var(--targetY) - 20px)) rotate(15deg) scale(1.05);
            }
            100% {
                transform: translate(var(--targetX), var(--targetY)) rotate(5deg) scale(1);
            }
        }

        @keyframes chickenFlyOut {
            0% {
                transform: translate(var(--targetX), var(--targetY)) rotate(5deg) scale(1);
            }
            15% {
                transform: translate(calc(var(--targetX) - 20px), calc(var(--targetY) + 30px)) rotate(-10deg) scale(1.1);
            }
            40% {
                transform: translate(calc(var(--targetX) + 100px), calc(var(--targetY) - 200px)) rotate(-25deg) scale(1);
            }
            100% {
                transform: translate(calc(var(--targetX) + 800px), calc(var(--targetY) - 800px)) rotate(-45deg) scale(0.6);
                opacity: 0;
            }
        }

        @keyframes noBtnShake {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            25% { transform: translate(-3px, 2px) rotate(-2deg); }
            50% { transform: translate(3px, -2px) rotate(2deg); }
            75% { transform: translate(-2px, 3px) rotate(-1deg); }
        }

        @keyframes noBtnBeingTaken {
            0% {
                transform: translate(0, 0) scale(1);
                opacity: 1;
            }
            30% {
                transform: translate(15px, -10px) scale(0.9);
                opacity: 1;
            }
            100% {
                transform: translate(750px, -750px) scale(0.3) rotate(40deg);
                opacity: 0;
            }
        }

        #yesBtn.transforming {
            animation: yesBtnToHeart 1.2s cubic-bezier(0.68, -0.55, 0.27, 1.55) forwards;
        }

        #yesBtn.heart-mode {
            background: linear-gradient(135deg, #ff2d55 0%, #ff375f 25%, #ff6b9d 50%, #c44569 75%, #e91e63 100%);
            background-size: 300% 300%;
            padding: 0;
            width: clamp(80px);
            min-width: 80px;
            max-width: 80px;
            height: 80px;
            border-radius: 50%;
            font-size: 42px;
            line-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 6px 25px rgba(255, 45, 85, 0.55);
            animation: heartBeat 1.2s ease-in-out infinite, heartColorShift 3s ease-in-out infinite;
            transition: transform 0.25s, box-shadow 0.25s;
        }

        #yesBtn.heart-mode:hover {
            transform: scale(1.12);
            box-shadow: 0 8px 35px rgba(255, 105, 180, 0.75);
        }

        @keyframes yesBtnToHeart {
            0% {
                background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
                padding: 15px 40px;
                width: auto;
                height: auto;
                border-radius: 50px;
                font-size: 1.2rem;
                color: white;
                transform: scale(1);
                box-shadow: 0 4px 15px rgba(17, 153, 142, 0.4);
            }
            35% {
                transform: scale(0.85) rotate(-8deg);
                background: linear-gradient(135deg, #48c9b0 0%, #58d68d 100%);
                border-radius: 40px;
            }
            60% {
                padding: 10px 30px;
                border-radius: 30px;
                transform: scale(0.9) rotate(5deg);
                background: linear-gradient(135deg, #ff9ab4 0%, #ff8fa3 100%);
            }
            100% {
                background: linear-gradient(135deg, #ff2d55 0%, #ff375f 25%, #ff6b9d 50%, #c44569 75%, #e91e63 100%);
                padding: 0;
                width: 80px;
                height: 80px;
                border-radius: 50%;
                font-size: 42px;
                transform: scale(1) rotate(0deg);
                box-shadow: 0 6px 25px rgba(255, 45, 85, 0.55);
            }
        }

        @keyframes heartColorShift {
            0% {
                background-position: 0% 50%;
                box-shadow: 0 6px 25px rgba(255, 45, 85, 0.55);
            }
            25% {
                background-position: 50% 100%;
                box-shadow: 0 6px 25px rgba(255, 105, 180, 0.6);
            }
            50% {
                background-position: 100% 50%;
                box-shadow: 0 6px 25px rgba(233, 30, 99, 0.6);
            }
            75% {
                background-position: 50% 0%;
                box-shadow: 0 6px 25px rgba(255, 20, 147, 0.55);
            }
            100% {
                background-position: 0% 50%;
                box-shadow: 0 6px 25px rgba(255, 45, 85, 0.55);
            }
        }

        @keyframes heartBeat {
            0%, 100% {
                transform: scale(1);
            }
            14% {
                transform: scale(1.08);
            }
            28% {
                transform: scale(1);
            }
            42% {
                transform: scale(1.1);
            }
            70% {
                transform: scale(1);
            }
        }
    </style>
</head>
<body>
    <div class="chicks" id="chicksContainer"></div>
    <div class="kittens" id="kittensContainer"></div>
    <div class="hearts" id="heartsContainer"></div>
    <div class="chicken-snatch" id="chickenSnatch" style="display:none;">🐔</div>
    
    <div class="container">
        <h1>Quer sair comigo? 💕</h1>
        
        <div class="buttons">
            <button id="yesBtn" class="btn">Sim</button>
            <button id="noBtn" class="btn">Não</button>
        </div>
        
        <div class="message" id="message"></div>
    </div>

    <script>
        const yesBtn = document.getElementById('yesBtn');
        const noBtn = document.getElementById('noBtn');
        const message = document.getElementById('message');
        const heartsContainer = document.getElementById('heartsContainer');
        const chicksContainer = document.getElementById('chicksContainer');
        const kittensContainer = document.getElementById('kittensContainer');
        const chickenSnatch = document.getElementById('chickenSnatch');
        let noClicks = 0;
        let chickenTriggered = false;

        const messages = [
            "Tem certeza? 🥺",
            "Pensa de novo! 😢",
            "Por favor? 🙏",
            "Vai se arrepender! 😭",
            "Eu não aceito não! 😤",
            "Tente de novo kkkk 😂",
            "Você não consegue clicar em mim! 🤪",
            "Desiste já! 🎉"
        ];

        let yesBtnTransformed = false;

        function transformYesBtnToHeart() {
            if (yesBtnTransformed) return;
            yesBtnTransformed = true;

            yesBtn.classList.add('transforming');

            const onTransformEnd = (e) => {
                if (e.animationName === 'yesBtnToHeart') {
                    yesBtn.classList.remove('transforming');
                    yesBtn.classList.add('heart-mode');
                    yesBtn.textContent = '❤️';
                    yesBtn.removeEventListener('animationend', onTransformEnd);
                    yesBtn.setAttribute('aria-label', 'Dizer sim com todo o coração');
                }
            };
            yesBtn.addEventListener('animationend', onTransformEnd);
        }

        function chickenTakeNoBtn() {
            if (chickenTriggered) return;
            chickenTriggered = true;

            const btnRect = noBtn.getBoundingClientRect();
            const targetX = btnRect.left + btnRect.width / 2 - 40;
            const targetY = btnRect.top - 30;

            chickenSnatch.style.setProperty('--targetX', `${targetX}px`);
            chickenSnatch.style.setProperty('--targetY', `${targetY}px`);
            chickenSnatch.style.display = 'block';
            chickenSnatch.classList.remove('leaving');
            chickenSnatch.classList.add('flying');

            noBtn.classList.add('no-btn-snatched');

            message.textContent = 'A galinha pegou o NÃO! 😂🐔';
            message.style.color = '#f39c12';
            message.style.fontWeight = '600';
            message.style.fontSize = '1.3rem';

            setTimeout(() => {
                chickenSnatch.classList.remove('flying');
                chickenSnatch.classList.add('leaving');
            }, 1200);

            const onChickenLeaveEnd = (e) => {
                if (e.animationName === 'chickenFlyOut') {
                    transformYesBtnToHeart();
                    noBtn.style.display = 'none';
                    noBtn.classList.remove('no-btn-snatched');
                    chickenSnatch.style.display = 'none';
                    chickenSnatch.classList.remove('leaving');
                    chickenSnatch.removeEventListener('animationend', onChickenLeaveEnd);

                    setTimeout(() => {
                        message.textContent = 'Agora só tem o SIM! 😏💕';
                    }, 400);
                }
            };
            chickenSnatch.addEventListener('animationend', onChickenLeaveEnd);
        }

        function moveNoButton() {
            if (chickenTriggered) return;

            if (noClicks >= 6 && !chickenTriggered) {
                chickenTakeNoBtn();
                noClicks++;
                return;
            }

            const maxX = window.innerWidth - noBtn.offsetWidth - 20;
            const maxY = window.innerHeight - noBtn.offsetHeight - 20;
            
            const randomX = Math.random() * maxX;
            const randomY = Math.random() * maxY;
            
            noBtn.style.position = 'fixed';
            noBtn.style.left = `${randomX}px`;
            noBtn.style.top = `${randomY}px`;
            noBtn.style.zIndex = '999';
            
            if (noClicks < messages.length) {
                message.textContent = messages[noClicks];
                message.style.color = '#eb3349';
            }
            noClicks++;
        }

        noBtn.addEventListener('mouseover', moveNoButton);
        noBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            moveNoButton();
        });

        function triggerYesCelebration() {
            message.textContent = 'Uhuuul! Sabia que você ia dizer sim! 🥰🎉';
            message.classList.add('success');
            noBtn.style.display = 'none';
            yesBtn.style.display = 'none';

            for (let i = 0; i < 15; i++) {
                setTimeout(() => {
                    const x = Math.random() * window.innerWidth;
                    const y = window.innerHeight * 0.3 + Math.random() * (window.innerHeight * 0.5);
                    createFirework(x, y);
                }, i * 300);
            }
        }

        yesBtn.addEventListener('click', triggerYesCelebration);

        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart');
            heart.textContent = ['❤️', '💕', '💖', '💗', '💝', '💘'][Math.floor(Math.random() * 6)];
            heart.style.left = `${Math.random() * window.innerWidth}px`;
            heart.style.top = `-60px`;
            heart.style.animationDuration = `${4 + Math.random() * 4}s`;
            heart.style.fontSize = `${30 + Math.random() * 25}px`;
            heartsContainer.appendChild(heart);
            
            setTimeout(() => heart.remove(), 8000);
        }

        function createFirework(startX, startY) {
            const numHearts = 25 + Math.floor(Math.random() * 15);
            const heartEmojis = ['❤️', '💕', '💖', '💗', '💝', '💘', '💓', '💞'];
            const launchHeight = window.innerHeight - startY + 100;
            
            for (let i = 0; i < numHearts; i++) {
                const heart = document.createElement('div');
                heart.classList.add('firework-heart');
                heart.textContent = heartEmojis[Math.floor(Math.random() * heartEmojis.length)];
                heart.style.left = `${startX}px`;
                heart.style.top = `${startY}px`;
                heart.style.fontSize = `${20 + Math.random() * 25}px`;
                
                const angle = (Math.PI * 2 / numHearts) * i + (Math.random() - 0.5) * 0.5;
                const distance = 80 + Math.random() * 120;
                const tx = Math.cos(angle) * distance;
                const ty = Math.sin(angle) * distance;
                
                heart.style.setProperty('--tx', `${tx}px`);
                heart.style.setProperty('--ty', `${ty}px`);
                heart.style.setProperty('--launchHeight', `${launchHeight}px`);
                heart.style.animationDelay = `${Math.random() * 0.1}s`;
                
                heartsContainer.appendChild(heart);
                setTimeout(() => heart.remove(), 3600);
            }
        }

        function createChick() {
            const chick = document.createElement('div');
            chick.classList.add('chick');
            chick.textContent = '🐥';
            chick.style.left = `${Math.random() * window.innerWidth}px`;
            chick.style.top = `-60px`;
            chick.style.animationDuration = `${4 + Math.random() * 4}s`;
            chick.style.fontSize = `${30 + Math.random() * 30}px`;
            const swayDir = Math.random() > 0.5 ? 1 : -1;
            chick.style.setProperty('--swayX', `${(20 + Math.random() * 30) * swayDir}px`);
            chick.style.setProperty('--rotationEnd', `${Math.random() > 0.5 ? 360 : -360}deg`);
            chicksContainer.appendChild(chick);
            
            setTimeout(() => chick.remove(), 8000);
        }

        function createKitten() {
            const kitten = document.createElement('div');
            kitten.classList.add('kitten');
            const kittenEmojis = ['🐱', '😺', '😸', '😻'];
            kitten.textContent = kittenEmojis[Math.floor(Math.random() * kittenEmojis.length)];
            kitten.style.left = `${Math.random() * window.innerWidth}px`;
            kitten.style.top = `-60px`;
            kitten.style.animationDuration = `${4.5 + Math.random() * 4}s`;
            kitten.style.fontSize = `${32 + Math.random() * 32}px`;
            const swayDir = Math.random() > 0.5 ? 1 : -1;
            kitten.style.setProperty('--swayX', `${(25 + Math.random() * 35) * swayDir}px`);
            kitten.style.setProperty('--rotationEnd', `${Math.random() > 0.5 ? 360 : -360}deg`);
            kittensContainer.appendChild(kitten);
            
            setTimeout(() => kitten.remove(), 8500);
        }

        setInterval(createChick, 500);
        setInterval(createKitten, 500);
    </script>

    <!-- Vercel Web Analytics -->
    <script>
        window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
    </script>
    <script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
